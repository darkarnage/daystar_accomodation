<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Photo credits · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="narrow">
  <div class="page-intro">
    <h1>Photo credits</h1>
    <p class="lead">The photographs in this demo are generic sample images from Wikimedia Commons. They are not pictures of the listed properties.</p>
  </div>
  <ul class="credit-list" id="credits"></ul>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  // Built from the IMAGES list in main.js, so credits always match the photos in use.
  $('#credits').innerHTML = Object.entries(IMAGES).map(([key, i]) => `<li>
    <img src="${imgUrl(key, true)}" alt="" loading="lazy" width="96" height="72">
    <p>${esc(i.alt)}<br>Photo by ${esc(i.by)}, <a href="${esc(i.page)}" rel="noopener">${esc(i.license)}</a></p></li>`).join('');
</script>
</body>
</html>
