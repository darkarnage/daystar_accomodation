<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Contact · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="page-intro">
    <h1>Contact us</h1>
    <p class="lead">Questions, a problem with a listing, or feedback? Send us a message.</p>
  </div>
  <div class="contact-grid">
    <div>
      <h2 style="font-size:1.25rem">Get in touch</h2>
      <ul class="info-list" id="info"></ul>
    </div>
    <div>
      <form id="contact-form" class="panel" novalidate>
        <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name"><p class="err"></p></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="err"></p></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6"></textarea><p class="err"></p></div>
        <div id="form-error" class="alert alert-error" role="alert" hidden></div>
        <button class="btn" type="submit">Send message</button>
      </form>
      <div id="sent" class="alert alert-ok" hidden></div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  $('#info').innerHTML = [
    ['mail', 'Email', 'hello@campusnest.example'],
    ['pin', 'Location', 'Athi River, Machakos County, Kenya'],
    ['shield', 'Problem with a listing?', 'Tell us the listing name and what looks wrong. We review reports quickly.'],
  ].map(([i, t, d]) => `<li><span class="ico">${icon(i, 20)}</span><div><b>${t}</b><span class="muted">${d}</span></div></li>`).join('');
  $('#sent').innerHTML = icon('checkCircle', 20) + '<span>Thanks! Your message has been received.</span>';

  const form = $('#contact-form'), errBox = $('#form-error');
  const bad = (n, t) => { const f = form.elements[n].closest('.field'); f.classList.toggle('invalid', !!t); $('.err', f).textContent = t; return !t; };
  const showError = t => { errBox.textContent = t; errBox.hidden = !t; };
  const busy = (button, on) => { button.disabled = on; button.classList.toggle('is-loading', on); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    showError('');
    const v = n => form.elements[n].value.trim();
    const ok = [bad('name', v('name').length >= 2 && v('name').length <= 100 ? '' : 'Enter your name (2 to 100 characters).'),
      bad('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')) && v('email').length <= 255 ? '' : 'Enter a valid email.'),
      bad('message', v('message').length >= 10 && v('message').length <= 3000 ? '' : 'Write 10 to 3000 characters.')].every(Boolean);
    if (!ok) return;
    const button = $('button[type=submit]', form);
    busy(button, true);
    try {
      const res = await fetch('/api/contact', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: v('name'), email: v('email'), message: v('message') }) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 201 && data.ok) { form.hidden = true; $('#sent').hidden = false; return; }   // saved: the server confirmed it
      if (res.status === 400 && data.errors) { for (const n of ['name', 'email', 'message']) bad(n, data.errors[n] || ''); return; }
      showError(data.error || 'Something went wrong and your message was not sent. Please try again.');
    } catch {
      showError('Could not reach the server. Your message is still here: check your connection and try again.');
    } finally {
      busy(button, false);   // the form is never cleared on a failure, so nothing the visitor typed is lost
    }
  });
</script>
</body>
</html>
