<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Contact · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="page-intro">
    <h1>Contact us</h1>
    <p class="lead">Questions, a problem with a listing, or feedback? Send us a message.</p>
  </div>
  <div class="contact-grid">
    <div>
      <h2 style="font-size:1.25rem">Get in touch</h2>
      <ul class="info-list" id="info"></ul>
      <p class="muted small" style="margin-top:var(--s5)">Demo details: nothing is sent or received yet.</p>
    </div>
    <div>
      <form id="contact-form" class="panel" novalidate>
        <div class="field"><label for="name">Your name</label><input id="name" name="name" autocomplete="name"><p class="err"></p></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="err"></p></div>
        <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="6"></textarea><p class="err"></p></div>
        <button class="btn" type="submit">Send message</button>
      </form>
      <div id="sent" class="alert alert-ok" hidden></div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  $('#info').innerHTML = [
    ['mail', 'Email', 'hello@campusnest.example'],
    ['pin', 'Location', 'Athi River, Machakos County, Kenya'],
    ['shield', 'Problem with a listing?', 'Tell us the listing name and what looks wrong. We review reports quickly.'],
  ].map(([i, t, d]) => `<li><span class="ico">${icon(i, 20)}</span><div><b>${t}</b><span class="muted">${d}</span></div></li>`).join('');
  $('#sent').innerHTML = icon('checkCircle', 20) + '<span>Thanks! Your message was received. (Demo: nothing is actually sent yet.)</span>';

  const form = $('#contact-form');
  const bad = (n, t) => { const f = form.elements[n].closest('.field'); f.classList.toggle('invalid', !!t); $('.err', f).textContent = t; return !t; };
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = n => form.elements[n].value.trim();
    const ok = [bad('name', v('name') ? '' : 'Enter your name.'),
      bad('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')) ? '' : 'Enter a valid email.'),
      bad('message', v('message').length >= 10 ? '' : 'Write at least 10 characters.')].every(Boolean);
    if (ok) { form.hidden = true; $('#sent').hidden = false; }
  });
</script>
</body>
</html>
