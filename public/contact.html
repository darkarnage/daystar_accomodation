<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="narrow">
  <div class="page-head"><h1>Contact us</h1><p class="muted">Questions, problems with a listing, or feedback? Send us a message.</p></div>
  <form id="contact-form" class="panel" novalidate>
    <div class="field"><label for="name">Your name</label><input id="name" name="name"><p class="err"></p></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email"><p class="err"></p></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><p class="err"></p></div>
    <button class="btn" type="submit">Send message</button>
  </form>
  <div id="sent" class="alert alert-ok" hidden>Thanks! Your message was received. (Demo: nothing is actually sent yet.)</div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  const form = $('#contact-form');
  const bad = (n, t) => { const f = form.elements[n].closest('.field'); f.classList.toggle('invalid', !!t); $('.err', f).textContent = t; return !t; };
  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = n => form.elements[n].value.trim();
    const ok = [bad('name', v('name') ? '' : 'Enter your name.'),
      bad('email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')) ? '' : 'Enter a valid email.'),
      bad('message', v('message').length >= 10 ? '' : 'Write at least 10 characters.')].every(Boolean);
    if (ok) { form.hidden = true; $('#sent').hidden = false; }
  });
</script>
</body>
</html>
