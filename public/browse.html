<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse listings · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="browse">
    <form class="filters panel" id="filters" aria-label="Filters">
      <h2>Filters</h2>
      <div class="field"><label for="q">Search</label><input id="q" name="q" type="search" placeholder="Area or keyword"></div>
      <div class="field"><label for="type">Room type</label>
        <select id="type" name="type">
          <option value="">Any</option>
          <option value="single">Single room</option><option value="bedsit">Bedsit</option>
          <option value="one_bedroom">One bedroom</option><option value="shared">Shared room</option><option value="hostel">Hostel</option>
        </select></div>
      <div class="field"><label for="maxRent">Max rent (KES)</label><input id="maxRent" name="maxRent" type="number" min="0" step="500" placeholder="e.g. 8000"></div>
      <div class="field"><label for="maxDist">Max distance (km)</label>
        <select id="maxDist" name="maxDist"><option value="">Any</option><option>1</option><option>2</option><option>5</option><option>10</option></select></div>
      <fieldset class="field" style="border:0;padding:0;margin:0 0 .8rem"><legend><b>Amenities</b></legend><div class="checks" id="amenity-checks" style="grid-template-columns:1fr"></div></fieldset>
      <label style="font-weight:400;display:flex;gap:.4rem;margin-bottom:1rem"><input type="checkbox" name="hideTaken" id="hideTaken"> Hide taken rooms</label>
      <button class="btn btn-ghost btn-sm" type="reset" id="clear">Clear filters</button>
    </form>

    <section aria-live="polite">
      <div class="results-head">
        <div><h1 style="font-size:1.6rem;margin:0">Browse listings</h1><p class="muted" id="count" style="margin:0"></p></div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <button class="btn btn-ghost btn-sm filter-toggle" id="toggle-filters" type="button">Filters</button>
          <label for="sort" class="muted" style="margin:0">Sort</label>
          <select id="sort" style="padding:.4rem;border-radius:8px;border:1px solid var(--line)">
            <option value="">Newest</option><option value="rent">Rent: low to high</option><option value="distance">Closest to campus</option>
          </select>
        </div>
      </div>
      <div class="grid" id="results"></div>
    </section>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/browse.js"></script>
</body>
</html>
