<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
  <div class="auth panel">
    <h1>Log in</h1>
    <div id="msg"></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="err"></p></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><p class="err"></p></div>
      <button class="btn" type="submit" style="width:100%">Log in</button>
    </form>
    <p class="muted" style="margin-top:1rem">New here? <a href="/register.html">Create an account</a></p>
    <div class="demo-box">
      <b>Demo mode</b> – the backend is not connected yet. Use a demo account (any password):
      <div><button type="button" class="btn btn-ghost btn-sm" data-demo="student">Student</button>
      <button type="button" class="btn btn-ghost btn-sm" data-demo="landlord">Landlord</button></div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
