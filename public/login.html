<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Log in · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="auth-split">
  <figure class="auth-photo" style="margin:0">
    <img src="/assets/images/bedroom-desk-tv.jpg" alt="Bedroom with a bed, a desk and a monitor" width="1280" height="960">
    <figcaption>Find a place to call home.<small>Log in to save favourites and see owner contacts.</small></figcaption>
  </figure>
  <div class="auth-form">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="sub">Welcome back. Log in as a student to save listings and contact owners.</p>
      <div id="msg"></div>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><p class="err"></p></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password"><p class="err"></p></div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="form-foot">New here? <a href="/register.html">Create an account</a></p>
      <div class="demo-box">
        <b>Demo account</b> (development only): <code>faith@student.daystar.ac.ke</code> / <code>demo-password</code>.
        <div class="row"><button type="button" class="btn btn-secondary btn-sm" data-demo="student">Log in as demo student</button></div>
      </div>
    </div>
  </div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
