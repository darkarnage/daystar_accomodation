<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Your favourites · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="page-head">
    <h1>Your favourites</h1>
    <p class="muted" id="count"></p>
  </div>
  <div class="grid" id="list" style="padding-bottom:var(--s6)"></div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  if (requireRole('student')) {
    // Favourite ids are kept in this browser. The listings come from the API, which only returns public ones,
    // so a listing that was rejected, taken or deleted quietly disappears from this page.
    const draw = async () => {
      const favs = getFavs();
      try {
        const list = favs.length ? (await apiGet('/api/listings?limit=100')).listings.filter(l => favs.includes(l.id)) : [];
        $('#count').textContent = list.length ? list.length + (list.length === 1 ? ' saved listing' : ' saved listings') : 'Listings you save appear here.';
        $('#list').innerHTML = list.length ? list.map(l => cardHTML(l)).join('') :
          `<div class="state">${icon('heart', 32)}<h3>No favourites yet</h3><p class="muted">Tap the heart on a listing to save it here and compare later.</p><a class="btn" href="/browse.html">Browse listings</a></div>`;
      } catch {
        $('#list').innerHTML = `<div class="state">${icon('close', 32)}<h3>Could not load your favourites</h3><p class="muted">Check your connection and try again.</p><button class="btn btn-secondary" type="button" onclick="location.reload()">Try again</button></div>`;
      }
    };
    draw();
    document.addEventListener('favchange', draw);
  }
</script>
</body>
</html>
