<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favourites · CampusNest</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="page-head"><h1>Your favourites</h1></div>
  <div class="grid" id="list"></div>
</main>
<footer id="site-footer"></footer>
<script src="/assets/js/main.js"></script>
<script>
  if (requireRole('student')) {
    const draw = () => {
      const favs = getFavs();
      const list = getListings().filter(l => l.status === 'approved' && favs.includes(l.id));
      $('#list').innerHTML = list.length ? list.map(cardHTML).join('') :
        '<div class="state"><h3>No favourites yet</h3><p class="muted">Tap the heart on a listing to save it here.</p><a class="btn" href="/browse.html">Browse listings</a></div>';
    };
    draw();
    document.addEventListener('favchange', draw);
  }
</script>
</body>
</html>
