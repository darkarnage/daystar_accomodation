<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <title>Moderate listings · CampusNest Admin</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body data-page="listings" class="admin">
<a class="skip" href="#main">Skip to content</a>
<div class="admin-shell">
  <aside id="admin-side" class="admin-side"></aside>
  <main id="main" class="admin-main">
    <div class="admin-head"><div><h1>Moderate listings</h1><p class="muted">Approve or reject submissions and manage what students can see.</p></div></div>
    <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
    <div id="table"></div>
  </main>
</div>
<dialog id="reject-dialog">
  <form method="dialog" id="reject-form">
    <h3>Reject listing</h3>
    <p class="muted" id="reject-title"></p>
    <div class="field"><label for="reason">Reason <span class="hint">(shown with the rejected listing)</span></label><textarea id="reason" rows="3" maxlength="255"></textarea><p class="err"></p></div>
    <div class="dialog-actions"><button class="btn btn-secondary btn-sm" value="cancel" formnovalidate>Cancel</button><button class="btn btn-danger btn-sm" id="reject-ok" value="ok">Reject listing</button></div>
  </form>
</dialog>
<script src="/assets/js/main.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
